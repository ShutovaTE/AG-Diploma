<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Поиск публикаций - Виртуальная арт-галерея</title>
    <link rel="stylesheet" th:href="@{/resources/css/style.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <h1>Результаты поиска</h1>
    <p class="search-page-info">Запрос: «<span th:text="${searchQuery}"></span>»</p>

    <div class="search-page-toolbar">
        <div class="search-page-info">
            Найдено: <span th:text="${artworks.totalElements}">0</span>
        </div>
        <div class="search-filters">
            <button type="button" class="filter-btn" disabled>По категориям</button>
            <button type="button" class="filter-btn" disabled>По выставкам</button>
            <button type="button" class="filter-btn" disabled>По художникам</button>
        </div>
    </div>

    <div th:if="${artworks != null and !artworks.content.isEmpty()}" class="artwork-grid">
        <div th:each="artwork : ${artworks.content}" class="artwork-card">
            <a th:href="@{/artwork/details/{id}(id=${artwork.id})}">
                <img th:src="@{'/uploads/' + ${#strings.replace(artwork.imagePath, ' ', '%20')}}"/>
                <h3 th:text="${artwork.title}"></h3>
            </a>
            <p>Автор:
                <span th:if="${artwork.user != null}" th:text="${artwork.user.username}"></span>
            </p>
            <p th:if="${artwork.categories != null and !artwork.categories.isEmpty()}">
                Категории:
                <span th:each="category, iterStat : ${artwork.categories}"
                      th:text="${category.name + (iterStat.last ? '' : ', ')}"></span>
            </p>
            <p th:text="${artwork.likes} + ' лайков'"></p>
        </div>
    </div>

    <div th:if="${artworks == null or artworks.content.isEmpty()}" class="empty-state">
        <p>По запросу ничего не найдено. Попробуйте изменить поисковый запрос или нажать другой режим поиска.</p>
    </div>

    <div th:replace="fragments/pagination :: pagination(${artworks}, '/artwork/search?query=' + ${searchQuery})"></div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
